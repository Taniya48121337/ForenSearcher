<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金标复核</title>
<style>
:root{
  --bg:#f6f5f1;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--faint:#9a9993;--line:#e3e1db;--soft:#f0eee8;
  --accent:#2f5d8a;--accent-soft:#e7eef6;--ok:#2e7d4f;--ok-soft:#e5f2ea;--warn:#a86400;--warn-soft:#fbf0de;
  --bad:#b3261e;--bad-soft:#fbe7e5;--mark:#fff1a8;--mark-ink:#3a3000;--span:#f7d4cf;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151513;--panel:#1e1e1b;--ink:#ecebe6;--muted:#a6a59e;--faint:#7c7b75;--line:#33322e;--soft:#252521;
  --accent:#8ab4df;--accent-soft:#1f2b38;--ok:#6cc08b;--ok-soft:#1c2c22;--warn:#e3a94f;--warn-soft:#30261a;
  --bad:#ef8a80;--bad-soft:#3a201d;--mark:#5a4d10;--mark-ink:#fff4c2;--span:#5a2a25;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#151513;--panel:#1e1e1b;--ink:#ecebe6;--muted:#a6a59e;--faint:#7c7b75;--line:#33322e;--soft:#252521;
  --accent:#8ab4df;--accent-soft:#1f2b38;--ok:#6cc08b;--ok-soft:#1c2c22;--warn:#e3a94f;--warn-soft:#30261a;
  --bad:#ef8a80;--bad-soft:#3a201d;--mark:#5a4d10;--mark-ink:#fff4c2;--span:#5a2a25;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.kbd{display:inline-block;min-width:18px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;font:11px/16px ui-monospace,Consolas,monospace;color:var(--muted);text-align:center;background:var(--panel)}
/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650}
.bar{flex:1;min-width:160px;max-width:360px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .agree{background:var(--ok)}.bar .change{background:var(--warn)}
.stat{color:var(--muted);font-size:13px;white-space:nowrap}
.stat b{color:var(--ink)}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-r input{width:96px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.btn{padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,.btn.primary{color:#fff}
/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 53px)}
nav{border-right:1px solid var(--line);position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;background:var(--panel)}
.grp{padding:12px 14px 4px;font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.nit{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;font-size:13px;border-left:3px solid transparent}
.nit:hover{background:var(--soft)}
.nit.cur{background:var(--accent-soft);border-left-color:var(--accent)}
.nit .id{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;width:40px}
.nit .lab{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.st{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;border:1.5px solid var(--line);color:transparent}
.st.agree{background:var(--ok);border-color:var(--ok);color:#fff}
.st.change{background:var(--warn);border-color:var(--warn);color:#fff}
.quick-link{margin:10px 14px 16px;display:block;text-align:center}
main{padding:20px 28px 150px;max-width:1180px;width:100%}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:start}
.top .card{margin:0}
.q{border-left:4px solid var(--accent);background:var(--accent-soft)}
.q .qt{font-size:15px;font-weight:600;line-height:1.6}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap}
.meta code{font-size:11.5px}
.verdict{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.b-full{background:var(--ok-soft);color:var(--ok)}.b-partial{background:var(--warn-soft);color:var(--warn)}
.b-none{background:var(--bad-soft);color:var(--bad)}.b-cannot_tell{background:var(--soft);color:var(--muted)}
.conf{font-size:12px;color:var(--muted)}
.why{font-size:13.5px}
.vbox{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--soft);font-size:13px}
.vbox .vt{font-weight:600;color:var(--bad)}
.statement{font-size:16px;line-height:1.75}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.span-c{background:var(--span);border-radius:3px;box-shadow:inset 0 -2px 0 var(--bad)}
.span-v{text-decoration:underline wavy var(--warn);text-underline-offset:4px}
.legend{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{display:inline-block;width:22px;height:12px;border-radius:3px}
.lim{margin-top:8px;font-size:13px;color:var(--muted)}
details.ctx{margin-top:10px;font-size:13.5px}
details.ctx summary{cursor:pointer;color:var(--accent)}
details.ctx div{margin-top:6px;padding:8px 10px;background:var(--soft);border-radius:8px}
.cur-sent{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
/* evidence */
.ev{border-top:1px solid var(--line);padding:12px 0 4px}
.ev:first-of-type{border-top:0;padding-top:2px}
.evh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.evh .eid{font:600 12.5px ui-monospace,Consolas,monospace;padding:0 6px;border-radius:4px;background:var(--soft)}
.evh .lbl{font-weight:600}
.evh a{font-size:12px;color:var(--accent);word-break:break-all}
.para{white-space:pre-wrap;word-break:break-word;font-size:13.5px;margin:6px 0;padding:6px 10px;border-radius:6px}
.para.hit{background:var(--soft)}
.gap{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:12px;border-radius:6px;padding:3px 10px;margin:4px 0}
.gap:hover{border-color:var(--accent);color:var(--accent)}
.json{white-space:pre-wrap;word-break:break-all;font:12px/1.55 ui-monospace,Consolas,monospace;background:var(--soft);padding:8px 10px;border-radius:6px;max-height:260px;overflow:auto;margin-top:6px}
.json.open{max-height:none}
.recov{margin:8px 0 2px;padding:8px 10px;border-radius:8px;border:1px solid var(--warn);background:var(--warn-soft);font-size:13px}
.recov b{color:var(--warn)}
.imgs{display:grid;gap:10px;margin-top:8px}
.imgs.two{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.imgs img{width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;display:block;background:var(--soft)}
.imgs figure{margin:0}
.imgs figcaption{font-size:12px;color:var(--muted);margin-top:3px}
.zoomset img{width:auto;max-width:100%;max-height:440px}
/* video */
.vcard .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.vcard figure{margin:0}
.vcard video{width:100%;max-height:420px;background:#000;border-radius:8px;display:block;cursor:pointer}
.vgrid.big{grid-template-columns:1fr}
.vgrid.big video{max-height:none}
.vscrub{width:100%;margin:6px 0 0;accent-color:var(--accent)}
.vcard figcaption{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.vcard figcaption b{color:var(--ink)}
.vctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.vctl .btn{padding:3px 9px;font-size:13px}
.vctl .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tchip{border:1px solid var(--line);border-radius:7px;padding:2px 9px;font:12.5px ui-monospace,Consolas,monospace;cursor:pointer;background:var(--panel)}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
.tchip .sd{font-family:system-ui,sans-serif;font-weight:700;margin-right:4px}
.tchip.stmt{border-style:dashed}
.vnote{font-size:12px;color:var(--muted);margin-top:6px}
.vbadge{font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted)}
.vwrap{position:relative}
.dbox{position:absolute;border:2px solid #ff3b30;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none;display:none}
.dline{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.dline h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.dsvg{width:100%;height:64px;display:block;cursor:pointer;background:var(--soft);border-radius:6px}
.dread{font-size:12.5px;margin-top:4px;color:var(--muted)}
.dread b{color:var(--ink)}
.dread .hit{color:var(--bad);font-weight:700}
.segchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg{border:1px solid var(--bad);border-radius:7px;padding:3px 9px;font-size:12.5px;background:var(--bad-soft)}
.seg button{border:0;background:transparent;color:var(--accent);padding:0 3px;font:inherit;text-decoration:underline;cursor:pointer}
/* decision bar */
.dock{position:fixed;left:250px;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.06);padding:10px 22px}
.dock-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1180px}
.agree-btn{padding:9px 16px;border-radius:9px;border:0;background:var(--ok);color:#fff;font-weight:650;font-size:14.5px;display:flex;gap:8px;align-items:center}
.agree-btn .kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.opt{padding:8px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);display:flex;gap:6px;align-items:center}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.claude::after{content:"Claude";font-size:10.5px;color:var(--muted);margin-left:2px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.dock .nav{margin-left:auto;display:flex;gap:6px}
.edit{display:none;margin-top:10px;gap:10px;max-width:1180px}
.edit.show{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.edit textarea{width:100%;min-height:58px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;resize:vertical}
.edit .lbl2{font-size:12px;color:var(--muted);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;cursor:pointer;user-select:none;background:var(--panel)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.save-btn{margin-top:8px}
.state-line{font-size:12.5px;color:var(--muted);margin-left:6px}
.state-line b{color:var(--ok)}
.state-line b.chg{color:var(--warn)}
/* toast */
.toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(10px);opacity:0;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:99px;font-size:13px;transition:.18s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,10,10,.88);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.lb.on{display:flex}
.lb .frame{max-width:96vw;max-height:88vh;overflow:auto}
.lb img{display:block;max-width:96vw;max-height:88vh;cursor:zoom-in}
.lb img.full{max-width:none;max-height:none;cursor:zoom-out}
.lb .cap{color:#ddd;font-size:13px}
/* quick */
.qgrid{display:grid;gap:10px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start}
.qcard.done-agree{border-left:4px solid var(--ok)}.qcard.done-change{border-left:4px solid var(--warn)}
.qcard .qid{font:600 13px ui-monospace,Consolas,monospace;padding-top:2px}
.qcard .qs{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qcard .qn{font-size:12.5px;color:var(--muted);margin-top:4px}
.qcard .qbtn{display:flex;flex-direction:column;gap:6px}
.qthumbs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.qthumbs img{height:46px;border-radius:4px;border:1px solid var(--line);cursor:zoom-in}
.done-view{text-align:center;padding:30px 10px}
.done-view h2{margin:0 0 6px}
table.sum{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;text-align:left}
table.sum td,table.sum th{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
/* context (宽口径) + extra items */
.ctxcard{border-left:4px solid var(--accent)}
.prem{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:8px;background:var(--soft)}
.prem .pid{font:600 12px ui-monospace,Consolas,monospace;color:var(--accent);margin-right:6px}
.prem .pq{font-size:12.5px;color:var(--muted);margin-top:4px}
.prem .pq mark{background:var(--mark);color:var(--mark-ink)}
.cand{font-size:12.5px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
.dock-row.ctxrow{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.ctxrow .lbl3{font-size:12.5px;color:var(--accent);font-weight:600;margin-right:4px}
.frag{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:8px}
.frag .fh{font-size:12px;color:var(--muted)}
.frag mark{background:var(--mark);color:var(--mark-ink)}
.req{font-size:15px;font-weight:600;margin:4px 0}
details.peek{margin-top:10px;font-size:13px;color:var(--muted)}
.help-k{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
@media (max-width:900px){.top{grid-template-columns:1fr}.edit.show{grid-template-columns:1fr}}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}nav{position:static;height:auto;max-height:240px}.dock{left:0;padding:8px 12px}main{padding:14px 16px 210px}.qcard{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>金标复核 · <span id="batchName"></span></h1>
  <div class="bar" title="绿=同意 Claude，橙=改判"><i class="agree" id="barA"></i><i class="change" id="barC"></i></div>
  <span class="stat" id="stat"></span>
  <div class="hdr-r">
    <label class="stat">标注人 <input id="who" placeholder="你的缩写"></label>
    <button class="btn" onclick="showHelp()">快捷键 <span class="kbd">?</span></button>
    <button class="btn" onclick="document.getElementById('imp').click()">导入</button>
    <input id="imp" type="file" accept=".json" hidden onchange="importFile(this.files[0])">
    <button class="btn primary" onclick="exportLabels()">导出标注</button>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="dock" id="dock"></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb" onclick="if(event.target===this)closeLb()"><div class="frame"><img id="lbImg" onclick="this.classList.toggle('full')"></div><div class="cap" id="lbCap"></div></div>
<script>
const DATA = /*__DATA__*/null;
const ITEMS = DATA.items, SPEC = DATA.spec.items, GROUPS = DATA.spec.groups, BATCH = DATA.meta.batch;
const KEY = 'gold_review_' + BATCH;
const MAIN = {full:'完全支持', partial:'部分支持', none:'不支持', cannot_tell:'无法判断'};
const OPTS = ['full','partial','none','cannot_tell'];
const ERRS = [['unsupported_assertion','断言无证据支持'],['scope_overreach','说过头'],['wrong_citation','引错证据'],['attribution_drift','把来源说法当事实'],['sloppy_numeric','数字/口径错'],['misread_fine_text','读错细节/画面'],['other','其他']];
const ORDER = ['A','B','C','D'];
const byId = Object.fromEntries(ITEMS.map(it => [it.id, it]));
const EXTRA = DATA.spec.extra_items || [], exById = Object.fromEntries(EXTRA.map(x => [x.id, x])), EXTRA_IDS = EXTRA.map(x => x.id);
const CTX = {ok:'成立', bad:'不成立', cannot_tell:'无法判断'}, CTXO = ['ok','bad','cannot_tell'];
const XOPT = {semcov: {yes:'已建立', no:'未建立', cannot_tell:'无法判断'}};
const PRIORITY = ORDER.flatMap(g => ITEMS.filter(it => SPEC[it.id].group === g).sort((a, b) => (SPEC[a.id].order ?? 99) - (SPEC[b.id].order ?? 99)).map(it => it.id));
const REST = ITEMS.filter(it => SPEC[it.id].group === 'E').map(it => it.id);
let st = {decisions:{}, who:'', ctx:{}, extra:{}}, view = {mode:'item', id: PRIORITY[0]}, draft = null, started = Date.now();
try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
st.ctx = st.ctx || {}; st.extra = st.extra || {};
function xopts(x){ return x.options || XOPT[x.kind] || {}; }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1300); }
function dec(id){ return st.decisions[id]; }
function stateOf(id){ const d = dec(id); return !d ? '' : (d.agreed ? 'agree' : 'change'); }

/* ---------- highlight helpers ---------- */
function markAll(html, needles, cls){
  let out = html;
  for (const n of needles) {
    if (!n) continue;
    const e = esc(n);
    if (!e.trim()) continue;
    const i = out.indexOf(e);
    if (i < 0) continue;
    out = out.slice(0, i) + `<span class="${cls}">` + e + '</span>' + out.slice(i + e.length);
  }
  return out;
}
function markQuotes(text, quotes){
  let html = esc(text);
  for (const q of quotes || []) { const e = esc(q); if (e && html.includes(e)) html = html.split(e).join('<mark>' + e + '</mark>'); }
  return html;
}
function spans(s){ return String(s || '').split(/[｜|]/).map(x => x.trim()).filter(Boolean); }

/* ---------- nav ---------- */
function renderNav(){
  let h = '';
  for (const g of ORDER) {
    const ids = PRIORITY.filter(id => SPEC[id].group === g);
    const done = ids.filter(id => dec(id)).length;
    h += `<div class="grp"><span>${esc(GROUPS[g])}</span><span>${done}/${ids.length}</span></div>`;
    for (const id of ids) {
      const c = SPEC[id].claude, s = stateOf(id);
      h += `<div class="nit ${view.mode==='item'&&view.id===id?'cur':''}" onclick="openItem('${id}')"><span class="st ${s}">${s==='agree'?'✓':s==='change'?'↺':''}</span><span class="id">${id}</span><span class="lab">${MAIN[c.main]}${c.conf==='中'?' · 中':''}</span></div>`;
    }
  }
  if (EXTRA.length) {
    const xd = EXTRA_IDS.filter(id => st.extra[id]).length;
    h += `<div class="grp"><span>${esc(GROUPS.F || 'F')}</span><span>${xd}/${EXTRA.length}</span></div>`;
    for (const x of EXTRA) {
      const a = st.extra[x.id];

    ${sp.swap ? `<div class="card" style="border-left:4px solid var(--warn)"><h3>测试题 · 不显示原视频</h3><div class="qt">这句话原来引的是 4126 视频的帧；这里已换成别的案例的图片。原视频会让你看到句子说的内容，反而干扰判断，所以本题不显示。只看下面这张图。</div></div>

}
function renderDock(){

    <div class="nav"><button class="btn" onclick="step(-1)">← 上一条</button><button class="btn" onclick="step(1)">下一条 →</button></div>

        <div class="chips">${ERRS.map(([k, t]) => `<span class="chip ${draft.errors.includes(k)?'on':''}" onclick="toggleErr('${k}')">${t}</span>`).join('')}</div></div>

function tick(){ if (view.mode === 'item' && view.id) { const d = dec(view.id); if (d) d.seconds = (d.seconds || 0) + Math.round((Date.now() - started) / 1000); started = Date.now(); } }
function record(id, main, errors, span, note, agreed, extra){
  const c = SPEC[id].claude, prev = dec(id);
  st.decisions[id] = {main, errors, span, note, agreed, claude_main: c.main, group: SPEC[id].group,
    seconds: (prev ? prev.seconds || 0 : 0) + Math.round((Date.now() - started) / 1000), at: new Date().toISOString(), ...(extra || {})};
  started = Date.now(); save();
}
function agree(){
  const id = view.id, c = SPEC[id].claude;
  record(id, c.main, c.errors.slice(), c.span, '同意 Claude 预标', true);
  toast(`${id} 已同意 · ${MAIN[c.main]}`); draft = null; advance();
}
function pick(o){
  const id = view.id, c = SPEC[id].claude, d = dec(id);
  if (o === c.main && !(o === 'partial' || o === 'none')) { agree(); return; }
  draft = {main:o, errors: o === c.main ? c.errors.slice() : (d && d.main === o ? d.errors.slice() : []),
           span: o === c.main ? c.span : (d && d.main === o ? d.span : (o === 'partial' || o === 'none' ? '' : '')), note: d && !d.agreed ? d.note : ''};
  renderDock(); setTimeout(() => { const b = $(o === 'partial' || o === 'none' ? 'spanBox' : 'noteBox'); if (b) b.focus(); }, 0);
}
function toggleErr(k){ const i = draft.errors.indexOf(k); i < 0 ? draft.errors.push(k) : draft.errors.splice(i, 1); renderDock(); }
function commit(){
  const id = view.id, c = SPEC[id].claude;
  const agreed = draft.main === c.main && (draft.span || '').trim() === (c.span || '').trim();
  record(id, draft.main, draft.errors, draft.span || '', draft.note || '', agreed);
  toast(`${id} 已保存 · ${MAIN[draft.main]}${agreed ? '' : '（改判）'}`); draft = null; advance();
}
function undo(){ delete st.decisions[view.id]; save(); draft = null; render(); toast('已撤销'); }
function advance(){
  if (SPEC[view.id] && SPEC[view.id].context && !st.ctx[view.id]) { toast('还差宽口径一题：7 成立 / 8 不成立 / 9 无法判断'); renderDock(); return; }
  const list = PRIORITY.includes(view.id) ? PRIORITY : REST;
  const i = list.indexOf(view.id);
  const next = list.slice(i + 1).find(id => !dec(id)) || list.find(id => !dec(id));
  if (!next) { if (list === PRIORITY) { openSummary(); toast('重点条目已全部复核'); } else openSummary(); return; }
  setTimeout(() => openItem(next), 160);
}
function step(k){ const list = PRIORITY.includes(view.id) ? PRIORITY : REST; const i = list.indexOf(view.id); const j = Math.max(0, Math.min(list.length - 1, i + k)); openItem(list[j]); }

function exportLabels(){
  tick(); save();
  const who = ($('who').value || '').trim();
  if (!who) { toast('先在右上角填你的缩写'); $('who').focus(); return; }
  if (/^claude/i.test(who)) { toast('缩写不能用 claude（那是预标注）'); return; }
  const ids = ITEMS.map(it => it.id).filter(id => st.decisions[id]);
  const out = {batch: BATCH, annotator: who, exported_at: new Date().toISOString(), mode: 'review_of_claude_draft',
    note: '人工复核 Claude 预标注（labels_claude-draft.json）后的结果；review.agreed 表示与预标一致，review.bulk 表示批量确认未逐条看。',
    labels: ids.map(id => { const d = st.decisions[id], it = byId[id];
      return {id, kind: it.kind, run: it.run, main: d.main, errors: d.errors, span: d.span, note: d.note, seconds: d.seconds || 0,
              ...(st.ctx[id] ? {context_label: st.ctx[id]} : {}),
              review: {claude_main: d.claude_main, agreed: d.agreed, group: d.group, quick: !!d.quick, bulk: !!d.bulk, at: d.at}}; }),
    context_only: Object.keys(st.ctx).filter(id => !st.decisions[id]).map(id => ({id, context_label: st.ctx[id]})),
    extra_labels: EXTRA_IDS.filter(id => st.extra[id]).map(id => { const x = exById[id], a = st.extra[id];
      return {id, kind: x.kind, run: x.run, unit: x.unit || null, requirement: x.requirement || null, choice: a.choice, note: a.note || '',
              seconds: a.seconds || 0, candidate_covered: x.candidate ? x.candidate.covered : null}; })};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `labels_${who}.json`; a.click();
  toast(`已导出 ${ids.length} 条 + 宽口径 ${Object.keys(st.ctx).length} + F 组 ${out.extra_labels.length} → labels_${who}.json`);
}
function importFile(f){
  if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); let n = 0;
    for (const r of d.labels || []) { if (!byId[r.id] || !r.main) continue; const c = SPEC[r.id].claude;
      st.decisions[r.id] = {main: r.main, errors: r.errors || [], span: r.span || '', note: r.note || '', seconds: r.seconds || 0,
        agreed: r.review ? !!r.review.agreed : r.main === c.main, claude_main: c.main, group: SPEC[r.id].group, quick: !!(r.review && r.review.quick), bulk: !!(r.review && r.review.bulk), at: new Date().toISOString()}; n++;
      if (r.context_label) st.ctx[r.id] = r.context_label; }
    for (const r of d.context_only || []) if (byId[r.id]) st.ctx[r.id] = r.context_label;
    for (const r of d.extra_labels || []) if (exById[r.id]) { st.extra[r.id] = {choice: r.choice, note: r.note || '', seconds: r.seconds || 0, at: new Date().toISOString()}; n++; }
    save(); render(); toast(`已导入 ${n} 条`); });
}

/* ---------- keys ---------- */
document.addEventListener('keydown', e => {
  const typing = /TEXTAREA|INPUT/.test(document.activeElement.tagName);
  if ($('lb').classList.contains('on')) {
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowRight') { lbIdx = (lbIdx + 1) % lbList.length; showLb(); }
    else if (e.key === 'ArrowLeft') { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; showLb(); }
    return;
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && draft) { e.preventDefault(); commit(); return; }
  if (e.key === 'Escape' && draft) { draft = null; renderDock(); document.activeElement.blur(); return; }
  if (typing) return;
  if (view.mode === 'extra') {
    const ks = Object.keys(xopts(exById[view.id]));
    if (/^[1-9]$/.test(e.key) && ks[+e.key - 1]) pickExtra(ks[+e.key - 1]);
    else if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') stepExtra(1);
    else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') stepExtra(-1);
    else if (e.key === 's' || e.key === 'S') openSummary();
    return;
  }
  if (view.mode !== 'item') { if (e.key === 'q' || e.key === 'Q') openQuick(); if (e.key === 's' || e.key === 'S') openSummary(); return; }
  if (e.key === ',' ) { vStep(-1); return; }
  if (e.key === '.' ) { vStep(1); return; }
  if (e.key === 'k' || e.key === 'K') { vPlay(); return; }
  if (e.key === 'Enter') { e.preventDefault(); draft ? commit() : agree(); }
  else if (/^[1-4]$/.test(e.key)) pick(OPTS[+e.key - 1]);
  else if (/^[7-9]$/.test(e.key) && SPEC[view.id].context) setCtx(CTXO[+e.key - 7]);
  else if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') step(1);
  else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') step(-1);
  else if (e.key === 'u' || e.key === 'U') undo();
  else if (e.key === 'q' || e.key === 'Q') openQuick();
  else if (e.key === 's' || e.key === 'S') openSummary();
  else if (e.key === '?') showHelp();
});
$('who').value = st.who || ''; $('who').oninput = e => { st.who = e.target.value; save(); };
$('batchName').textContent = BATCH;
window.addEventListener('resize', () => dUpdate());
window.addEventListener('beforeunload', () => { tick(); save(); });
const first = PRIORITY.find(id => !dec(id));
if (first) openItem(first); else openSummary();
</script>
</body>
