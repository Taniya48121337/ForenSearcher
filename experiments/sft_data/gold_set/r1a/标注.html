have approximately 0.5 s precision; continuous pixel identity and transformations between sampled moments were not verified.[E21]", "requirements": [{"id": "REQ1", "text": "A 与 B 中内容对应（相同或经变换）的片段，以及两侧各自的时间范围", "must_cite": true}, {"id": "REQ2", "text": "对应关系的画面依据：两侧对应帧的内容，以及画面包装、裁剪、叠加等变换", "must_cite": true}, {"id": "REQ3", "text": "未能确定的内容：边界精度、未检查的区间；不把内容对应推断为原创归属或传播先后", "must_cite": false}], "findings": [], "evidence": [{"id": "E4", "label": "frame of video E1 at 0.000 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 0.000 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":0.0,\"time_s\":0.0}", "image": "media/vcsl_pair_12_r1_1_E4.jpg"}, {"id": "E13", "label": "frame of video E2 at 0.000 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：B（E2 → frame of video E2 at 0.000 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":0.0,\"time_s\":0.0}", "image": "media/vcsl_pair_12_r1_1_E13.jpg"}, {"id": "E21", "label": "INSPECT compare_media result", "source_url": null, "acquired_by": "INSPECT/compare_media", "provenance": "来源材料：A、B（E1、E2 → INSPECT compare_media result）", "modalities": ["text"], "text": "{\"operation\":\"compare_media\",\"summary_lines\":[\"B matches A: 100% of A's half-second samples are found in B (A 80 s, B 80 s; the matched footage lies in B 0-80 s).\",\"No face could be compared (no frontal face found in matched frames).\"],\"corresponding_spans\":[\"A 0.0-80.2 s = B 0.0-80.0 s\"],\"images\":[],\"limitations\":[\"Differences are measured between two files; which one is the original is not decided by this tool.\",\"Time boundaries are accurate to about 0.5 s; pass range_a_s for frame-exact differences inside one span.\",\"Regions and faces are checked only at the sampled moments listed in coverage; short changes between samples can be missed.\",\"Overlays (subtitles, logos), crops, colour grading or a different upload of the same footage also produce differences.\"],\"note\":\"These lines are the conclusions of the measurement; the raw tables behind them (alignment runs, shot list, frame statistics) are not part of this record. Spans under 3 s that align at another speed or backwards are alignment noise around cuts.\"}"}, {"id": "E22", "label": "frame of video E2 at 0.240 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：B（E2 → frame of video E2 at 0.240 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":0.25,\"time_s\":0.24}", "image": "media/vcsl_pair_12_r1_1_E22.jpg"}, {"id": "E24", "label": "frame of video E2 at 80.200 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：B（E2 → frame of video E2 at 80.200 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":80.19,\"time_s\":80.2}", "image": "media/vcsl_pair_12_r1_1_E24.jpg"}, {"id": "E25", "label": "frame of video E1 at 0.240 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 0.240 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":0.25,\"time_s\":0.24}", "image": "media/vcsl_pair_12_r1_1_E25.jpg"}, {"id": "E27", "label": "frame of video E1 at 80.200 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 80.200 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":80.19,\"time_s\":80.2}", "image": "media/vcsl_pair_12_r1_1_E27.jpg"}]}, {"id": "A007", "kind": "answer", "run": "vcsl_pair_15_r1_1", "case_id": "vcsl:pair_15", "request": "request_0008", "task": "In the given videos A and B, find the segments that correspond to each other (identical or transformed), and give the time ranges on both sides with supporting evidence. Do not infer original authorship from a content correspondence. The input contains only the video track; do not assess audio.", "answer": "A and B contain partially corresponding footage: the comparison finds matches in B for 72% of A’s half-second samples, within approximate envelopes A 13.2–98.8 s ↔ B 13–99 s; these are not verified continuous identical segments or a precise segment-by-segment mapping. [E27]\n\nThe comparison reports A 0.0–13.2 s and A 98.8–115.6 s as unmatched in B. [E27]", "requirements": [{"id": "REQ1", "text": "A 与 B 中内容对应（相同或经变换）的片段，以及两侧各自的时间范围", "must_cite": true}, {"id": "REQ2", "text": "对应关系的画面依据：两侧对应帧的内容，以及画面包装、裁剪、叠加等变换", "must_cite": true}, {"id": "REQ3", "text": "未能确定的内容：边界精度、未检查的区间；不把内容对应推断为原创归属或传播先后", "must_cite": false}], "findings": [], "evidence": [{"id": "E27", "label": "INSPECT compare_media result", "source_url": null, "acquired_by": "INSPECT/compare_media", "provenance": "来源材料：A、B（E1、E2 → INSPECT compare_media result）", "modalities": ["text"], "text": "{\"operation\":\"compare_media\",\"summary_lines\":[\"B matches A: 72% of A's half-second samples are found in B (A 116 s, B 116 s; the matched footage lies in B 13-99 s).\",\"A uses B 13-99 s only; the rest of B (116 s in all) is not in A.\",\"Not in B: A 0.0-13.2 s (13.2 s). Say what it shows and whether it belongs with the footage around it.\",\"Not in B: A 98.8-115.6 s (16.8 s). Say what it shows and whether it belongs with the footage around it.\",\"Changed region: A 17.2-24.2 s, x 0.01-0.99 y 0.12-0.23 (7.4% of the frame) differs from B at the same moment in 7 samples while the rest of the frame matches: an object there was replaced, added or altered (typical of AI video editing); name the object in B and what A shows instead.\",\"Changed region: A 29.2-43.2 s, x 0.41-0.93 y 0.12-0.29 (3.3% of the frame) differs from B at the same moment in 13 samples while the rest of the frame matches: an object there was replaced, added or altered (typical of AI video editing); name the object in B and what A shows instead.\",\"Changed region: A 35.2-47.2 s, x 0.01-0.72 y 0.77-0.88 (3.5% of the frame) differs from B at the same moment in 10 samples while the rest of the frame matches: an object there was replaced, added or altered (typical of AI video editing); name the object in B and what A shows instead.\",\"Changed region: A 88.2-94.2 s, x 0.01-0.99 y 0.27-0.44 (3.9% of the frame) differs from B at the same moment in 7 samples while the rest of the frame matches: an object there was replaced, added or altered (typical of AI video editing); name the object in B and what A shows instead.\",\"Changed region: A 76.2-87.2 s, x 0.18-0.99 y 0.23-0.40 (3.5% of the frame) differs from B at the same moment in 8 samples while the rest of the frame matches: an object there was replaced, added or altered (typical of AI video editing); name the object in B and what A shows instead.\",\"Changed region: A 48.2-53.2 s, x 0.01-0.99 y 0.61-0.88 (5.1% of the frame) differs from B at the same moment in 5 samples while the rest of the frame matches: an object there was replaced, added or altered (typical of AI video editing); name the object in B and what A shows instead.\",\"1 shorter mismatch(es) under 3 s (often fast motion or a re-timed cut): 14.8-16.7 s.\",\"1 short span(s) under 3 s align with B at another speed or backwards (usually imprecise alignment around a cut, not an edit): A 13.3-14.7 s.\",\"No face could be compared (no frontal face found in matched frames).\"],\"corresponding_spans\":[\"A 16.8-26.7 s\n…（原文共 4103 字，只显示前 2500 字）"}]}, {"id": "A008", "kind": "answer", "run": "averimatec_e94_r1_1", "case_id": "averimatec:e94", "request": "request_0018", "task": "The given image circulated with the following claim: \"This is a photo of a rioter participating in the violence on the Brazilian government buildings on January 8, 2023.\" (claim date: 2023-01-08). Find where and when this image was first published, as far as the evidence allows, and whether its original context matches the claim. Cite the sources and dates you rely on, and state what could not be determined.", "answer": "The earliest dated matching copy found is on Thread Reader App (https://threadreaderapp.com/thread/1952806933208908106.html), documented no later than August 5, 2025, its first recorded archive capture; this does not establish the photograph’s first publication date or original publisher. [E6][E17]\n\nThe claim that it shows a rioter participating in the January 8, 2023 violence cannot be verified: the capture location, date and original event remain undetermined, so their correspondence to the claim cannot be established. [E1][E6][E17][E27]\n\nThe photograph shows a man holding a megaphone among people outside glass buildings, with no visible attack on a government building; that absence alone does not prove it depicts a different event. [E1][E6]", "requirements": [{"id": "REQ1", "text": "这张图片能查到的最早一份（网站、页面）及其日期，以及日期的性质（页面声明 / 上传 / 存档，只能说明\"不晚于\"）", "must_cite": true}, {"id": "REQ2", "text": "最早那份所说的图片内容（地点、时间、事件）与声明是否相符", "must_cite": true}, {"id": "REQ3", "text": "未能确定的内容与结论的适用范围", "must_cite": false}], "findings": [], "evidence": [{"id": "E1", "label": "Material A", "source_url": null, "acquired_by": "HARNESS/ingest", "provenance": "来源材料：A（E1，原始材料）", "modalities": ["image"], "text": "{\"original_filename\":\"A.jpg\",\"media_type\":\"image/jpeg\",\"byte_size\":180569}", "image": "media/averimatec_e94_r1_1_E1.jpg"}, {"id": "E6", "label": "Thread by @SputnikInt on Thread Reader App - Thread Reader App", "source_url": "https://threadreaderapp.com/thread/1952806933208908106.html", "acquired_by": "SEARCH/open/image+Pillow", "provenance": "来源：外部网页 threadreaderapp.com", "modalities": ["image"], "text": "{\"width\": 1200, \"height\": 799, \"format\": \"JPEG\", \"source_url\": \"https://pbs.twimg.com/media/GxhkO_WWEAAlS89.jpg\"}", "image": "media/averimatec_e94_r1_1_E6.jpg"}, {"id": "E17", "label": "dates of https://threadreaderapp.com/thread/1952806933208908106.html", "source_url": "https://threadreaderapp.com/thread/1952806933208908106.html", "acquired_by": "SEARCH/dates", "provenance": "来源：外部网页 threadreaderapp.com", "modalities": ["text"], "text": "Dates for https://threadreaderapp.com/thread/1952806933208908106.html:\n- earliest Internet Archive capture of this page: 2025-08-05 (https://web.archive.org/web/20250805190358/https://threadreaderapp.com/thread/1952806933208908106.html); the page existed no later than this date, which is not a publication date\n- the image file https://pbs.twimg.com/media/GxhkO_WWEAAlS89.jpg has no Internet Archive capture"}, {"id": "E27", "label": "INSPECT compare_media result", "source_url": null, "acquired_by": "INSPECT/compare_media", "provenance": "来源：材料 A、外部网页 threadreaderapp.com（E1、E6 → INSPECT compare_media result）", "modalities": ["text"], "text": "{\"operation\":\"compare_media\",\"summary_lines\":[\"The two images differ in pixels: changed area 0.67% (threshold 48), difference box x 0.05–0.94, y 0.36–1.00 (relative to the A picture).\"],\"images\":[],\"note\":\"These lines are the conclusions of the measurement; the raw tables behind them (alignment runs, shot list, frame statistics) are not part of this record. Spans under 3 s that align at another speed or backwards are alignment noise around cuts.\"}"}]}, {"id": "A009", "kind": "answer", "run": "averimatec_e74_r1_1", "case_id": "averimatec:e74", "request": "request_0013", "task": "The given image circulated with the following claim: \"A photograph authentically showed a crowd of migrants invading the U.S. border in May 2023.\" (claim date: 2023-05-07). Find where and when this image was first published, as far as the evidence allows, and whether its original context matches the claim. Cite the sources and dates you rely on, and state what could not be determined.", "answer": "The earliest matching copy found was on [Sputnik Kyrgyzstan](https://ru.sputnik.kg/20190216/usa-tramp-chrezvychajnoe-polozhenie-1043364935.html), whose title and URL indicate February 16, 2019; the independently established archive bound is no later than March 2, 2024, not a verified first-publication date for the photograph. [E8][E9][E15]\n\nThe May 2023 U.S.-border claim is misleading and unverified: the matching article concerns Donald Trump’s national-emergency declaration, but that publication context does not establish the photograph’s location, capture date or event. [E9][E18]\n\nThe supplied image is a narrower framing of the matching Sputnik photograph; the comparison found no differences exceeding its threshold within the aligned region. [E1][E8][E18]\n\nEarlier candidate pages from the Los Angeles Times and CBS News declare October 19, 2018 publication dates, but their photographs were not confirmed as matches and therefore cannot establish this image’s earlier publication. [E24][E25]\n\nThe first publisher, actual first-publication date, capture date, exact bridge and original event remain undetermined, so the original scene cannot reliably be identified as the claimed May 2023 U.S.-border event. [E8][E18][E24][E25]", "requirements": [{"id": "REQ1", "text": "这张图片能查到的最早一份（网站、页面）及其日期，以及日期的性质（页面声明 / 上传 / 存档，只能说明\"不晚于\"）", "must_cite": true}, {"id": "REQ2", "text": "最早那份所说的图片内容（地点、时间、事件）与声明是否相符", "must_cite": true}, {"id": "REQ3", "text": "未能确定的内容与结论的适用范围", "must_cite": false}], "findings": [], "evidence": [{"id": "E1", "label": "Material A", "source_url": null, "acquired_by": "HARNESS/ingest", "provenance": "来源材料：A（E1，原始材料）", "modalities": ["image"], "text": "{\"original_filename\":\"A.jpg\",\"media_type\":\"image/jpeg\",\"byte_size\":227491}", "image": "media/averimatec_e74_r1_1_E1.jpg"}, {"id": "E8", "label": "В США введен режим чрезвычайного положения - 16.02.2019, Sputnik Кыргызстан", "source_url": "https://ru.sputnik.kg/20190216/usa-tramp-chrezvychajnoe-polozhenie-1043364935.html", "acquired_by": "SEARCH/open/image+Pillow", "provenance": "来源：外部网页 ru.sputnik.kg", "modalities": ["image"], "text": "{\"width\": 1920, \"height\": 1206, \"format\": \"JPEG\", \"source_url\": \"https://sputnik.kg/img/104274/89/1042748988_0:307:4048:2851_1920x0_80_0_0_7aa279f23147e6a154645be8caa855a2.jpg\"}", "image": "media/averimatec_e74_r1_1_E8.jpg"}, {"id": "E9", "label": "В США введен режим чрезвычайного положения - 16.02.2019, Sputnik Кыргызстан", "source_url": "https://ru.sputnik.kg/20190216/usa-tramp-chrezvychajnoe-polozhenie-1043364935.html", "acquired_by": "SEARCH/open/http+trafilatura", "provenance": "来源：外部网页 ru.sputnik.kg", "modalities": ["text"], "text": "[1] БИШКЕК, 16 фев — Sputnik. Президент США Дональд Трамп подписал указ о введении в стране режима чрезвычайного положения, сообщает [РИА Новости.](https://ria.ru/20190215/1550948507.html)\n\n[2] В то время как американский лидер во дворе Белого дома объявил журналистам о намерении подписать документ, его пресс-секретарь Сара Сандерс опубликовала в Twitter фото Трампа за столом в овальном кабинете.\n\n[3] \"Президент подписывает декларацию о национальном режиме ЧП в связи с угрозой безопасности государства и гуманитарным кризисом на южной границе\", — написала Сандерс.\n\n[4] President [@realDonaldTrump](https://twitter.com/realDonaldTrump?ref_src=twsrc%5Etfw) signs the Declaration for a National Emergency to address the national security and humanitarian crisis at the Southern Border. [pic.twitter.com/0bUhudtwvS](https://t.co/0bUhudtwvS)\n\n[5] [15 февраля 2019 г.](https://twitter.com/PressSec/status/1096439568063184896?ref_src=twsrc%5Etfw)\n\n[6] Решение президента спровоцировало приостановку работы правительственных учреждений на 34 дня."}, {"id": "E15", "label": "dates of https://ru.sputnik.kg/20190216/usa-tramp-chrezvychajnoe-polozhenie-1043364935.html", "source_url": "https://ru.sputnik.kg/20190216/usa-tramp-chrezvychajnoe-polozhenie-1043364935.html", "acquired_by": "SEARCH/dates", "provenance": "来源：外部网页 ru.sputnik.kg", "modalities": ["text"], "text": "Dates for https://ru.sputnik.kg/20190216/usa-tramp-chrezvychajnoe-polozhenie-1043364935.html:\n- earliest Internet Archive capture of this page: 2024-03-02 (https://web.archive.org/web/20240302164103/https://ru.sputnik.kg/20190216/usa-tramp-chrezvychajnoe-polozhenie-1043364935.html); the page existed no later than this date, which is not a publication date\n- the image file https://sputnik.kg/img/104274/89/1042748988_0:307:4048:2851_1920x0_80_0_0_7aa279f23147e6a154645be8caa855a2.jpg has no Internet Archive capture"}, {"id": "E18", "label": "INSPECT compare_media result", "source_url": null, "acquired_by": "INSPECT/compare_media", "provenance": "来源：材料 A、外部网页 ru.sputnik.kg（E1、E8 → INSPECT compare_media result）", "modalities": ["text"], "text": "{\"operation\":\"compare_media\",\"summary_lines\":[\"No pixel difference with area ≥ min_area (0.0005) was found in the compared region of the two images (measured 0.000%).\"],\"images\":[],\"note\":\"These lines are the conclusions of the measurement; the raw tables behind them (alignment runs, shot list, frame statistics) are not part of this record. Spans under 3 s that align at another speed or backwards are alignment noise around cuts.\"}"}, {"id": "E24", "label": "dates of https://www.cbsnews.com/pictures/migrants-caravan-honduras-mexico-us-border-2018/", "source_url": "https://www.cbsnews.com/pictures/migrants-caravan-honduras-mexico-us-border-2018/", "acquired_by": "SEARCH/dates", "provenance": "来源：外部网页 cbsnews.com", "modalities": ["text"], "text": "Dates for https://www.cbsnews.com/pictures/migrants-caravan-honduras-mexico-us-border-2018/:\n- published date declared by the page: 2018-10-19 (when this page says it was published; the picture or video in it may have appeared earlier elsewhere)\n- last-modified date declared by the page: 2018-11-26\n- earliest Internet Archive capture of this page: 2018-10-21 (https://web.archive.org/web/20181021080958/https://www.cbsnews.com/pictures/migrants-caravan-honduras-mexico-us-border-2018/); the page existed no later than this date, which is not a publication date"}, {"id": "E25", "label": "dates of https://www.latimes.com/world/mexico-americas/la-fg-mexico-migrants-guatemala-20181019-story.html", "source_url": "https://www.latimes.com/world/mexico-americas/la-fg-mexico-migrants-guatemala-20181019-story.html", "acquired_by": "SEARCH/dates", "provenance": "来源：外部网页 latimes.com", "modalities": ["text"], "text": "Dates for https://www.latimes.com/world/mexico-americas/la-fg-mexico-migrants-guatemala-20181019-story.html:\n- published date declared by the page: 2018-10-19 (when this page says it was published; the picture or video in it may have appeared earlier elsewhere)\n- last-modified date declared by the page: 2018-10-19\n- earliest Internet Archive capture of this page: 2018-10-19 (https://web.archive.org/web/20181019195928/http://www.latimes.com/world/mexico-americas/la-fg-mexico-migrants-guatemala-20181019-story.html); the page existed no later than this date, which is not a publication date"}]}, {"id": "A010", "kind": "answer", "run": "averimatec_e421_r1_1", "case_id": "averimatec:e421", "request": "request_0022", "task": "The given image circulated with the following claim: \"North Korean leader Kim Jong Un visited Putin in Moscow in 2022.\" (claim date: 2022-09-30). Find where and when this image was first published, as far as the evidence allows, and whether its original context matches the claim. Cite the sources and dates you rely on, and state what could not be determined.", "answer": "The image’s first publisher and publication date could not be determined; no dated exact copy was established, so no reliable “no later than” date can be given.[E19][E25][E26] The Ladoshki archive date of 2025-09-09 concerns a different photograph and cannot date this image.[E20][E22][E23]\n\nThe claim that it shows Kim Jong Un visiting Putin in Moscow in 2022 remains unverified.[E10][E25][E26] Primorye24’s article describes a meeting at the Far Eastern Federal University in Vladivostok; its photograph closely corresponds to the supplied image’s reception setting but shows a different moment, not an identical frame.[E10][E1][E9][E25] Its publication date was not established.[E19]\n\n[Radio Svoboda](https://www.svoboda.org/a/29898923.html) reports a planned April 25 meeting on Russky Island in Vladivostok, and [Azattyq Asia](https://www.azattyqasia.org/a/29902442.html) describes the leaders’ first meeting there.[E27][E28] These pages do not establish the supplied photograph’s provenance or capture date; whether they contain the same capture remains undetermined.[E27][E29][E28] The evidence therefore suggests a Vladivostok context, but does not conclusively establish this image’s original event or resolve the claimed year.[E10][E25][E26]", "requirements": [{"id": "REQ1", "text": "这张图片能查到的最早一份（网站、页面）及其日期，以及日期的性质（页面声明 / 上传 / 存档，只能说明\"不晚于\"）", "must_cite": true}, {"id": "REQ2", "text": "最早那份所说的图片内容（地点、时间、事件）与声明是否相符", "must_cite": true}, {"id": "REQ3", "text": "未能确定的内容与结论的适用范围", "must_cite": false}], "findings": [], "evidence": [{"id": "E1", "label": "Material A", "source_url": null, "acquired_by": "HARNESS/ingest", "provenance": "来源材料：A（E1，原始材料）", "modalities": ["image"], "text": "{\"original_filename\":\"A.jpg\",\"media_type\":\"image/jpeg\",\"byte_size\":40100}", "image": "media/averimatec_e421_r1_1_E1.jpg"}, {"id": "E9", "label": "Долгожданная встреча: Саммит Владимира Путина и Ким Чен Ына начинается", "source_url": "https://primorye24.ru/news/post/109369-dolgozhdannaya-vstrecha-sammit-vladimira-putina-i-kim-chen-yna-nachinaetsya", "acquired_by": "SEARCH/open/image+Pillow", "provenance": "来源：外部网页 primorye24.ru", "modalities": ["image"], "text": "{\"width\": 1228, \"height\": 685, \"format\": \"JPEG\", \"source_url\": \"https://primorye24.ru/uploads/default/2019/04/25/68c538470e32dc687d2d14d8efcd98654b5bd6ec.jpeg\"}", "image": "media/averimatec_e421_r1_1_E9.jpg"}, {"id": "E10", "label": "Долгожданная встреча: Саммит Владимира Путина и Ким Чен Ына начинается", "source_url": "https://primorye24.ru/news/post/109369-dolgozhdannaya-vstrecha-sammit-vladimira-putina-i-kim-chen-yna-nachinaetsya", "acquired_by": "SEARCH/open/http+trafilatura", "provenance": "来源：外部网页 primorye24.ru", "modalities": ["text"], "text": "[1] Долгожданная встреча: Саммит Владимира Путина и Ким Чен Ына начинается\n\n[2] Лидеры двух государств встретились в ДВФУ\n\n[3] Президент России Владимир Путин и лидер КНДР Ким Чен Ын встретились во Владивостоке, сообщает РИА VladNews.\n\n[4] [Путин](https://vladnews.ru/2019-04-25/150399/putin_pribyl) уже прибыл в ДВФУ, где состоялось официальное приветствие лидеров.\n\n[5] Отметим, что главы двух государств будут общаться около часа в формате тет-а-тет. Затем российско- корейские переговоры продолжатся в расширенном составе.\n\n[6] Напомним, 24 апреля лидер КНДР Ким Чен Ын прибыл в Приморье, утром его в Хасане [встретил глава края](https://vladnews.ru/2019-04-24/150315/oleg_kozhemyako) Олег Кожемяко. [Во Владивосток](https://vladnews.ru/2019-04-24/150355/poezd_pribyl) северокорейский [правитель прибыл](https://vladnews.ru/2019-04-24/150358/epohalnoe_pribytie) в 17:50.\n\n[7] В ходе общения с прессой [Ким Чен Ын заявил](https://vladnews.ru/2019-04-24/150364/vpervye_dolgoe), что надеется обсудить с российским президентом Владимиром Путиным проблему межкорейского урегулирования."}, {"id": "E19", "label": "dates of https://primorye24.ru/news/post/109369-dolgozhdannaya-vstrecha-sammit-vladimira-putina-i-kim-chen-yna-nachinaetsya", "source_url": "https://primorye24.ru/news/post/109369-dolgozhdannaya-vstrecha-sammit-vladimira-putina-i-kim-chen-yna-nachinaetsya", "acquired_by": "SEARCH/dates", "provenance": "来源：外部网页 primorye24.ru", "modalities": ["text"], "text": "Dates for https://primorye24.ru/news/post/109369-dolgozhdannaya-vstrecha-sammit-vladimira-putina-i-kim-chen-yna-nachinaetsya:\n- the image file https://primorye24.ru/uploads/default/2019/04/25/68c538470e32dc687d2d14d8efcd98654b5bd6ec.jpeg has no Internet Archive capture\n- no date was found: the page declares none and the Internet Archive has no capture; this does not show when the page or its picture first appeared"}, {"id": "E20", "label": "dates of https://ladoshki.ch/news/world/na-voennom-parade-v-chest-80-letija-pobedy-kitaj-vpervye-pokazal-strategicheskuju-jadernuju-triadu/", "source_url": "https://ladoshki.ch/news/world/na-voennom-parade-v-chest-80-letija-pobedy-kitaj-vpervye-pokazal-strategicheskuju-jadernuju-triadu/", "acquired_by": "SEARCH/dates", "provenance": "来源：外部网页 ladoshki.ch", "modalities": ["text"], "text": "Dates for https://ladoshki.ch/news/world/na-voennom-parade-v-chest-80-letija-pobedy-kitaj-vpervye-pokazal-strategicheskuju-jadernuju-triadu/:\n- earliest Internet Archive capture of this page: 2025-09-09 (https://web.archive.org/web/20250909042940/https://ladoshki.ch/news/world/na-voennom-parade-v-chest-80-letija-pobedy-kitaj-vpervye-pokazal-strategicheskuju-jadernuju-triadu/); the page existed no later than this date, which is not a publication date\n- the image file https://ladoshki.ch/files/2025/51aae3a2e378940d82477fffa700e198.jpeg has no Internet Archive capture"}, {"id": "E22", "label": "difference composite (images): left A=E1, middle B=E16, right the aligned B, red = differing pixels, green box = difference extent; changed area 54.020%", "source_url": null, "acquired_by": "INSPECT/diff_media", "provenance": "来源：材料 A、外部网页 ladoshki.ch（E1、E16 → difference composite (images): left A=E1…）", "modalities": ["image"], "text": "{\"bbox\":[0.0,0.0,1.0,1.0],\"changed_area\":0.5402,\"kind\":\"single\",\"operation\":\"diff_media\",\"panels\":[\"a_image\",\"b_image\",\"diff_overlay\"],\"registration_mode\":\"resize\",\"threshold\":48,\"zoom\":null}", "image": "media/averimatec_e421_r1_1_E22.jpg"}, {"id": "E23", "label": "INSPECT compare_media result", "source_url": null, "acquired_by": "INSPECT/compare_media", "provenance": "来源：材料 A、外部网页 ladoshki.ch（E1、E16 → INSPECT compare_media result）", "modalities": ["text"], "text": "{\"operation\":\"compare_media\",\"summary_lines\":[\"The two images differ in pixels: changed area 54.02% (threshold 48), difference box x 0.00–1.00, y 0.00–1.00 (relative to the A picture).\"],\"images\":[],\"note\":\"These lines are the conclusions of the measurement; the raw tables behind them (alignment runs, shot list, frame statistics) are not part of this record. Spans under 3 s that align at another speed or backwards are alignment noise around cuts.\"}"}, {"id": "E25", "label": "difference composite (images): left A=E1, middle B=E9, right the aligned B, red = differing pixels, green box = difference extent; changed area 24.601%", "source_url": null, "acquired_by": "INSPECT/diff_media", "provenance": "来源：材料 A、外部网页 primorye24.ru（E1、E9 → difference composite (images): left A=E1…）", "modalities": ["image"], "text": "{\"bbox\":[0.0,0.0148,0.8146,0.9444],\"changed_area\":0.24601,\"kind\":\"single\",\"operation\":\"diff_media\",\"panels\":[\"a_image\",\"b_image\",\"diff_overlay\"],\"registration_mode\":\"homography\",\"threshold\":48,\"zoom\":null}", "image": "media/averimatec_e421_r1_1_E25.jpg"}, {"id": "E26", "label": "INSPECT compare_media result", "source_url": null, "acquired_by": "INSPECT/compare_media", "provenance": "来源：材料 A、外部网页 primorye24.ru（E1、E9 → INSPECT compare_media result）", "modalities": ["text"], "text": "{\"operation\":\"compare_media\",\"summary_lines\":[\"The two images differ in pixels: changed area 24.60% (threshold 48), difference box x 0.00–0.81, y 0.01–0.94 (relative to the A picture).\"],\"images\":[],\"note\":\"These lines are the conclusions of the measurement; the raw tables behind them (alignment runs, shot list, frame statistics) are not part of this record. Spans under 3 s that align at another speed or backwards are alignment noise around cuts.\"}"}, {"id": "E27", "label": "Как Владивосток к встрече Владимира Путина с Ким Чен Ыном готовится", "source_url": "https://www.svoboda.org/a/29898923.html", "acquired_by": "SEARCH/open/http+trafilatura", "provenance": "来源：外部网页 svoboda.org", "modalities": ["text"], "text": "[1] Президент России Владимир Путин встретится с руководителем Северной Кореи Ким Чен Ыном во Владивостоке 25 апреля. Переговоры двух лидеров пройдут в кампусе Дальневосточного федерального университета на острове Русский, в нескольких километрах от Владивостока. Ким Чен Ын приехал в Россию 24 апреля на том же бронепоезде, на котором в 2002 году приезжал его отец Ким Чен Ир.\n\n[2] Во Владивостоке и на острове Русский уже несколько дней дежурят журналисты из России, Японии и Южной Кореи, но официальной информации о предстоящей встрече очень мало. Лишь по некоторым деталям происходящего в городе и на острове понятно, что идет подготовка к встрече.\n\n[3] Накануне визита в копицентре университетского кампуса в корпусе S появилось предупреждение: \"В связи с приездом Ким Чен Ира копицентр будет закрыт. Проявите солидарность\". Путаница в именах северокорейских лидеров, видимо, отражает то, в какой спешке шла подготовка кампуса к встрече в верхах. Её время и место долго держались в секрете по договоренности с северокорейской стороной.\n\n[4] В соцсетях уже появилось и ироническое \"продолжение\" поста о подготовке университета к визиту \"Ким Чен Ира\".\n\n[5] В кампусе ДВФУ 24 апреля усилили охрану. Кроме копировального центра в корпусе S с 17 по 30 апреля будет закрыт и спортивный зал. Из бассейна уже [спустили](https://primamedia.ru/news/805148/?from=37) воду. Также, как рассказали изданию \"Сибирь.Реалии\" студенты, в корпусе занавесили все окна, и проход туда закрыт.\n\n[6] – Перекрыты зоны около S, гостиницы №1, 2, 3 и до спортивного стадиона. Думаю, ещё и на набережную тоже не пустят. Сейчас через пять метров стоят там охранники и никого не пускают. Ещё везде стоит ДПС для контроля, – рассказала студентка ДВФУ.\n\n[7] Корреспондент \"Сибирь.Реалий\" заметил много сотрудников в штатском на территории кампуса. Они стоят по двое-трое человек и внимательно следят за обстановкой вокруг. Парковка рядом с кампусом также перекрыта – студентам приходится ехать далеко за пределами кампуса, чтобы встать в лесу или вдоль дороги. Занятия в ДВФУ не отменили, хотя некоторые очень на это рассчитывали.\n\n[8] – Лучше бы пары отменили, раз парковаться рядом со входом нельзя. Автобусы сегодня будут забитые, парковаться далеко, ещё и пробки везде будут. Нам, студентам, от таких поездок только хуже живётся. Но кто о нас думает?\n\n[9] Уже накануне на территорию учебных корпусов в кампусе ДВФУ можно было попасть только по студенческому билету или зачётной книжке. Раньше проходили просто по паспорту, п\n…（原文共 10542 字，只显示前 2500 字）"}, {"id": "E28", "label": "Путин и Ким Чен Ын встречаются во Владивостоке", "source_url": "https://www.azattyqasia.org/a/29902442.html", "acquired_by": "SEARCH/open/http+trafilatura", "provenance": "来源：外部网页 azattyqasia.org", "modalities": ["text"], "text": "[1] Президент России Владимир Путин встречается с лидером Северной Кореи Ким Чен Ыном. Это первая встреча глав двух государств. Она проходит на территории кампуса Дальневосточного федерального университета на острове Русский во Владивостоке.\n\n[2] Переговоры на высшем уровне, как ранее сообщили в Кремле, продлятся около четырех часов. Сначала Путин и Ким поговорят тет-а-тет, после чего пройдут переговоры в расширенном составе с участием делегаций двух стран. Ожидается, что лидеры России и Северной Кореи обсудят пути решения ядерной проблемы Корейского полуострова, а также перспективы развития двусторонних отношений.\n\n[3] Перед разговором за закрытыми дверями Путин приветствовал усилия Ким Чен Ына по развитию межкорейского диалога и по нормализации отношений с США.\n\n[4] Как в России встречали Ким Чен Ына\n\n[5] Показать большеСократить текст\n\n[6] Показать большеСократить текст\n\n[7] Показать большеСократить текст\n\n[8] Показать большеСократить текст\n\n[9] Показать большеСократить текст\n\n[10] Показать большеСократить текст\n\n[11] Показать большеСократить текст\n\n[12] Показать большеСократить текст\n\n[13] Показать большеСократить текст\n\n[14] Показать большеСократить текст\n\n[15] Показать большеСократить текст\n\n[16] Previous slide\n\n[17] Next slide\n\n[18] Содержание переговоров не разглашается, но, по мнению опрошенных российской газетой «Коммерсант» экспертов, учитывая нынешние условия и отведенное на беседу время, от встречи не стоит ожидать прорыва. Кремль уже подтвердил, что по итогам встречи лидеров не будет ни совместных заявлений, ни подписания документов. Однако ожидается, что президент России выйдет к журналистам, чтобы поделиться впечатлениями от саммита.\n\n[19] До этого Владимир Путин и Ким Чен Ын ни разу не встречались. Более того, Ким Чен Ын никогда не бывал в России. Последняя встреча президента России и главы Северной Кореи состоялась в 2011 году. Тогда Дмитрий Медведев провел переговоры с отцом нынешнего главы Северной Кореи Ким Чен Иром в Улан-Удэ.\n\n[20] В феврале в Ханое состоялся второй саммит Северной Кореи и США. На нём обсуждалось полное прекращение ядерной программы Пхеньяна в обмен на снятие всех американских санкций. Встреча закончилась неудачей — Дональд Трамп и Ким Чен Ын не подписали совместной декларации."}, {"id": "E29", "label": "Во Владивостоке завершились переговоры Путина и Ким Чен Ына", "source_url": "https://www.svoboda.org/a/29902394.html", "acquired_by": "SEARCH/open/http+trafilatura", "provenance": "来源：外部网页 svoboda.org", "modalities": ["text"], "text": "[1] Во Владивостоке завершились переговоры президента России Владимира Путина с лидером Северной Кореи Ким Чен Ыном. Они заняли около трех с половиной часов.\n\n[2] На торжественном приёме после завершения переговоров Путин поднял тост \"за дальнейшее укрепление дружбы и сотрудничества между Российской Федерацией и Корейской Народной Демократической Республикой\" и \"за здоровье товарища председателя Ким Чен Ына и всех присутствующих\" – [сообщает](https://tass.ru/politika/6374997?utm_source=twitter.com&utm_medium=social&utm_campaign=smm_social_share) ТАСС.\n\n[3] Первый саммит Путина и Ким Чен Ына начался в четверг с беседы в формате тет-а-тет, которая продлилась около двух часов – вдвое дольше запланированного. Затем переговоры продолжились в расширенном составе.\n\n[4] При этом Ким Чен Ын опоздал на встречу с Владимиром Путиным. Президенту России, который сам часто задерживается перед переговорами на высшем уровне, пришлось ожидать лидера КНДР около получаса. \"Спасибо, что приехали\", – сказал Путин Киму, когда тот появился у зала переговоров.\n\n[5] В ходе встречи за закрытыми дверями президент России обсудил с лидером Северной Кореи шаги по улучшению ситуации на Корейском полуострове. По словам Путина, встреча была обстоятельной. Ким Чен Ын назвал переговоры содержательными, а также добавил, что рад визиту в Россию.\n\n[6] Содержание переговоров не разглашается, но, по мнению опрошенных \"Коммерсантом\" экспертов, учитывая нынешние условия и отведенное на беседу время, от встречи не стоит ожидать прорыва. Кремль уже подтвердил, что по итогам встречи лидеров не будет ни совместных заявлений, ни подписания документов. Однако ожидается, что президент России выйдет к журналистам, чтобы поделиться впечатлениями от саммита.\n\n[7] Перед разговором за закрытыми дверями Путин приветствовал усилия Ким Чен Ына по развитию межкорейского диалога и по нормализации отношений с США.\n\n[8] До этого Владимир Путин и Ким Чен Ын ни разу не встречались. Более того, лидер КНДР никогда не бывал в России. Последняя встреча президента России и главы Северной Кореи состоялась в 2011 году. Тогда Дмитрий Медведев провел переговоры с отцом нынешнего главы КНДР Ким Чен Иром в Улан-Удэ.\n\n[9] В феврале в Ханое состоялся второй саммит КНДР и США. На нём обсуждалось полное прекращение ядерной программы КНДР в обмен на снятие всех американских санкций в отношении Пхеньяна. Встреча закончилась неудачей – [Дональд Трамп и Ким Чен Ын](https://www.svoboda.org/a/29878990.html) не подписали совместной декларац\n…（原文共 2503 字，只显示前 2500 字）"}]}]};

const KEY = 'gold_labels_' + BATCH;
let labels = {}, cur = 0, filter = 'all', started = Date.now();
try { labels = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { labels = {}; }
try { document.getElementById('annotator').value = localStorage.getItem(KEY + '_who') || ''; } catch (e) {}
document.getElementById('annotator').onchange = e => { try { localStorage.setItem(KEY + '_who', e.target.value); } catch (x) {} };

const ERR = {
  finding: [['unsupported_assertion','断言无证据支持'],['scope_overreach','说过头（超出证据范围）'],['wrong_citation','引错证据'],['attribution_drift','把来源的说法当成事实'],['sloppy_numeric','数字/单位/口径错'],['misread_fine_text','读错细节文字/画面'],['other','其他']],
  answer: [['unsupported_assertion','断言无证据支持'],['scope_overreach','说过头'],['wrong_citation','引错'],['omitted_required_fact','漏了必须回答的要点'],['premature_finish','证据不足就结束'],['wrong_label','结论方向错'],['other','其他']],
  plan_task: [['overlapping_sibling_tasks','与同轮其他任务重叠'],['dependent_sibling_tasks','依赖同轮其他任务结果'],['redundant_reinvestigation','重复调查已解决的问题'],['other','其他']],
  plan: [['task_not_gap_driven','任务不针对未解决缺口'],['overlapping_sibling_tasks','同轮任务重叠'],['premise_smuggling','题面夹带未证实前提'],['dependent_sibling_tasks','依赖同轮其他任务结果'],['redundant_reinvestigation','重复调查已解决的问题'],['other','其他']],
};
const MAIN = {
  finding: {q:'这条结论是否被它所引的证据支持？', opts:[['full','完全支持'],['partial','部分支持（有超出证据的部分）'],['none','不支持'],['cannot_tell','无法判断（证据看不全等）']]},
  answer: {q:'这份最终答案整体是否可接受？', opts:[['acceptable','可接受'],['minor','有小问题，仍可接受'],['unacceptable','不可接受'],['cannot_tell','无法判断']]},
  plan_task: {q:'这个任务该不该派？', opts:[['good','该派'],['minor','该派，题面有小问题'],['bad','不该派，或题面有实质问题'],['cannot_tell','无法判断']]},
  plan: {q:'这轮派出的任务整体是否合理？', opts:[['good','合理'],['minor','基本合理，有小问题'],['bad','不合理'],['cannot_tell','无法判断']]},
};
function esc(s){return String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {} renderList(); }
function lab(id){ return labels[id] || (labels[id] = {errors:[], seconds:0}); }
function done(it){ const l = labels[it.id]; return l && l.main; }
function visible(){ return ITEMS.map((it,i)=>[it,i]).filter(([it])=> filter==='all' || (filter==='todo' ? !done(it) : it.kind===filter)); }
function setFilter(f){ filter=f; renderList(); }
function renderList(){
  const n = ITEMS.filter(done).length;
  document.getElementById('progress').textContent = `${n} / ${ITEMS.length} 已标`;
  document.getElementById('list').innerHTML = visible().map(([it,i]) =>
    `<div class="it ${i===cur?'cur':''}" onclick="show(${i})"><span>${it.id} · ${esc(it.run).slice(0,22)}</span><span class="dot ${done(it)?'done':''}"></span></div>`).join('');
}
function tick(){ if (ITEMS[cur]) { const l = lab(ITEMS[cur].id); l.seconds += Math.round((Date.now()-started)/1000); started = Date.now(); } }
function show(i){ tick(); cur = Math.max(0, Math.min(ITEMS.length-1, i)); started = Date.now(); render(); renderList(); window.scrollTo(0,0); }
function go(d){ show(cur + d); }
function evidenceHtml(list){
  if (!list || !list.length) return '<div class="help">（没有引用证据）</div>';
  return list.map(e => `<div class="ev"><div class="head">${esc(e.id)} · ${esc(e.label || '')}</div>
    ${e.missing ? `<div class="help">${esc(e.missing)}</div>` : ''}
    ${e.source_url ? `<div class="url">${esc(e.source_url)}</div>` : ''}
    ${e.acquired_by ? `<div class="help">获取方式：${esc(e.acquired_by)}${e.provenance ? '；' + esc(e.provenance) : ''}</div>` : ''}
    ${e.image ? `<img loading="lazy" src="${esc(e.image)}" alt="${esc(e.id)}">` : ''}
    ${e.text ? `<pre>${esc(e.text)}</pre>` : ''}</div>`).join('');
}
function render(){
  const it = ITEMS[cur], l = lab(it.id), m = MAIN[it.kind];
  let body = `<div class="meta">${it.id} · ${it.kind} · ${esc(it.run)} ${it.workspace ? '· ' + esc(it.workspace) : ''} ${it.case_id ? '· ' + esc(it.case_id) : ''}</div>`;
  if (it.kind === 'finding') {
    body += `<div class="box"><h3>${it.context ? '总任务' : '工作区接到的任务'}</h3>${esc(it.task)}</div>
      ${it.context ? `<div class="box"><h3>这句所在的最终答案（只用来理解指代，不作证据）</h3><div class="help" style="white-space:pre-wrap">${esc(it.context)}</div></div>` : ''}
      <div class="box"><h3>待判结论（${esc(it.finding_id)}）</h3><div class="statement">${esc(it.statement)}</div>
      ${it.limitations.length ? `<div class="help" style="margin-top:6px">报告自述的限制：${it.limitations.map(esc).join('；')}</div>` : ''}</div>
      <div class="box"><h3>所引证据（只按这些判断，不用外部知识补）</h3>${evidenceHtml(it.evidence)}</div>`;
  } else if (it.kind === 'answer') {
    body += `<div class="box"><h3>总任务</h3>${esc(it.task)}</div>
      <div class="box"><h3>最终答案</h3><div class="statement" style="white-space:pre-wrap">${esc(it.answer)}</div></div>
      <div class="box"><h3>案卷要求（答案应覆盖）</h3>${it.requirements.map(r => `<div class="req">${esc(r.id)}${r.must_cite?'':'（可选）'}：${esc(r.text)}
        <span class="opt" style="display:inline-flex;margin-left:8px">${[['yes','覆盖'],['no','未覆盖']].map(([v,t]) => `<label class="${(l.req||{})[r.id]===v?'on':''}"><input type="radio" name="req_${r.id}" ${(l.req||{})[r.id]===v?'checked':''} onchange="setReq('${r.id}','${v}')">${t}</label>`).join('')}</span></div>`).join('') || '<div class="help">（没有案卷）</div>'}</div>
      <div class="box"><h3>答案引用的 Finding</h3>${it.findings.map(f => `<div class="ev"><div class="head">${esc(f.id)} ${f.workspace ? '· ' + esc(f.workspace) : ''}</div>${esc(f.statement || f.missing)}
        ${(f.limitations||[]).length ? `<div class="help">限制：${f.limitations.map(esc).join('；')}</div>` : ''}${(f.evidence_ids||[]).length ? `<div class="help">引用 ${f.evidence_ids.join('、')}</div>` : ''}</div>`).join('') || '<div class="help">（无）</div>'}</div>
      <div class="box"><h3>答案直接引用的证据</h3>${evidenceHtml(it.evidence)}</div>`;
  } else if (it.kind === 'plan_task') {
    const radio = (field, opts) => `<div class="opt" style="margin-top:4px">${opts.map(([v,tx]) => `<label class="${l[field]===v?'on':''}"><input type="radio" name="${field}" ${l[field]===v?'checked':''} onchange="setField('${field}','${v}')">${tx}</label>`).join('')}</div>`;
    body += `<div class="box"><h3>总任务（第 ${esc(it.round)} 轮）</h3>${esc(it.task)}</div>
      <div class="box"><h3>案卷要求</h3>${it.requirements.map(r => `<div class="req">${esc(r.id)}${r.must_cite?'':'（可选）'}：${esc(r.text)}</div>`).join('') || '<div class="help">（没有案卷）</div>'}</div>
      <div class="box"><h3>此前已提交的报告（派任务时能看到的全部）</h3>${it.reports_so_far.map(r => `<div class="ev"><div class="head">${esc(r.task_id)} · ${esc(r.status)}</div><div class="help">${esc(r.task)}</div>
        ${r.findings.map(f => `<div>· ${esc(f.id)}：${esc(f.statement)}${f.limitations.length ? `<span class="help">（限制：${f.limitations.map(esc).join('；')}）</span>` : ''}</div>`).join('')}</div>`).join('') || '<div class="help">（这是第一轮，还没有报告）</div>'}</div>
      <div class="box"><h3>待判任务 ${esc(it.task_label)}</h3><div class="statement">${esc(it.target.task)}</div><div class="help">材料：${(it.target.materials||[]).join('、') || '（无）'}</div>
        ${it.siblings.length ? `<div class="help" style="margin-top:6px">同轮其他任务：${it.siblings.map(t => esc(t.label) + ' ' + esc(t.task)).join('；')}</div>` : ''}</div>
      <div class="box"><h3>A. 题面有没有把还没证实的说法当成事实写进去？</h3><div class="help">"证实"只看上面已提交的报告；题面说"核实某说法是否属实"不算夹带。</div>
        ${radio('premise', [['clean','没有'],['smuggled','有'],['unsure','不确定']])}
        <div class="help" style="margin-top:6px">若"有"：照抄夹带的片段（多段用 ｜ 分隔）</div><textarea oninput="setText('premise_span',this.value)">${esc(l.premise_span||'')}</textarea></div>
      <div class="box"><h3>B. 这个任务是否针对此前报告还没解决的缺口？</h3>${radio('gap', [['gap','针对未解决的缺口'],['no_gap','不针对（要查的已解决，或与缺口无关）'],['unsure','不确定']])}</div>`;
  } else {
    body += `<div class="box"><h3>总任务（第 ${esc(it.round)} 轮）</h3>${esc(it.task)}</div>
      <div class="box"><h3>此前已提交的报告</h3>${it.reports_so_far.map(r => `<div class="ev"><div class="head">${esc(r.task_id)} · ${esc(r.status)}</div><div class="help">${esc(r.task)}</div>
        ${r.findings.map(f => `<div>· ${esc(f.id)}：${esc(f.statement)}${f.limitations.length ? `<span class="help">（限制：${f.limitations.map(esc).join('；')}）</span>` : ''}</div>`).join('')}</div>`).join('') || '<div class="help">（这是第一轮，还没有报告）</div>'}</div>
      <div class="box"><h3>本轮派出的任务</h3>${it.proposed_tasks.map((t,k) => `<div class="req"><b>T${k+1}</b> ${esc(t.task)} <span class="help">${(t.materials||[]).join('、')}</span>
        <div class="opt" style="margin-top:4px">${[['yes','针对未解决的缺口'],['no','不针对'],['unsure','不确定']].map(([v,tx]) => `<label class="${(l.tasks||{})['T'+(k+1)]===v?'on':''}"><input type="radio" name="t_${k}" ${(l.tasks||{})['T'+(k+1)]===v?'checked':''} onchange="setTask('T${k+1}','${v}')">${tx}</label>`).join('')}</div></div>`).join('')}</div>`;
  }
  body += `<div class="box"><h3>${m.q} <span class="help">键盘 1–4</span></h3><div class="opt">${m.opts.map(([v,t],k) => `<label class="${l.main===v?'on':''}"><input type="radio" name="main" ${l.main===v?'checked':''} onchange="setMain('${v}')">${k+1}. ${t}</label>`).join('')}</div></div>
    <div class="box"><h3>具体问题（可多选）</h3><div class="chips">${ERR[it.kind].map(([v,t]) => `<span class="chip ${l.errors.includes(v)?'on':''}" onclick="toggleErr('${v}')">${t}</span>`).join('')}</div>
      ${it.kind==='finding' ? `<div style="margin-top:8px"><div class="help">超出证据的具体片段（原文照抄，可多段用 ｜ 分隔）</div><textarea oninput="setText('span',this.value)">${esc(l.span||'')}</textarea></div>` : ''}
      <div style="margin-top:8px"><div class="help">备注</div><textarea oninput="setText('note',this.value)">${esc(l.note||'')}</textarea></div></div>
    <div class="row"><span class="help">本条累计用时 ${Math.round((l.seconds||0)/60*10)/10} 分钟（切换条目时累计）</span><button class="primary" onclick="go(1)">保存并下一条</button></div>`;
  document.getElementById('view').innerHTML = body;
}
function setMain(v){ lab(ITEMS[cur].id).main = v; save(); render(); }
function setReq(r,v){ const l = lab(ITEMS[cur].id); (l.req = l.req || {})[r] = v; save(); render(); }
function setField(k,v){ lab(ITEMS[cur].id)[k] = v; save(); render(); }
function setTask(t,v){ const l = lab(ITEMS[cur].id); (l.tasks = l.tasks || {})[t] = v; save(); render(); }
function toggleErr(v){ const l = lab(ITEMS[cur].id); l.errors = l.errors.includes(v) ? l.errors.filter(x=>x!==v) : [...l.errors, v]; save(); render(); }
function setText(k,v){ lab(ITEMS[cur].id)[k] = v; save(); }
function exportLabels(){
  tick();
  const who = document.getElementById('annotator').value.trim() || 'anon';
  const out = {batch: BATCH, annotator: who, exported_at: new Date().toISOString(),
    labels: ITEMS.filter(it => labels[it.id]).map(it => ({id: it.id, kind: it.kind, run: it.run, ...labels[it.id]}))};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `labels_${who}.json`; a.click();
}
function importLabels(file){
  if (!file) return;
  file.text().then(t => { const d = JSON.parse(t); if (d.batch !== BATCH && !confirm('批次名不一致，仍然导入？')) return;
    for (const r of d.labels) { const {id, kind, run, ...rest} = r; labels[id] = rest; } save(); render(); });
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  const it = ITEMS[cur]; const opts = MAIN[it.kind].opts;
  if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') go(1);
  else if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowLeft') go(-1);
  else if (/^[1-4]$/.test(e.key)) setMain(opts[+e.key-1][0]);
});
window.addEventListener('beforeunload', () => { tick(); try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {} });
render(); renderList();
</script>
</body>
</html>
