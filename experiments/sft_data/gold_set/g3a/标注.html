<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>核验器金标标注</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e2e1dc;--accent:#2f5d8a;--ok:#2e7d4f;--warn:#b26a00;--bad:#b3261e;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#ecebe6;--muted:#a3a29b;--line:#34332f;--accent:#8ab4df;--ok:#6cc08b;--warn:#e0a54a;--bad:#ef8a80;--chip:#28303a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2;flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}
header input{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:110px}
button{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.progress{color:var(--muted)}
main{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
nav{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
nav .it{display:flex;justify-content:space-between;padding:6px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
nav .it.cur{background:var(--chip)}
nav .dot{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:6px}
nav .dot.done{background:var(--ok)}
nav .filter{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:4px;flex-wrap:wrap}
nav .filter button{padding:2px 7px;white-space:nowrap;font-size:12.5px}
section{padding:16px 22px 80px;max-width:1100px}
.meta{color:var(--muted);font-size:12px;margin-bottom:6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.box h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.statement{font-size:15px}
.ev{border-top:1px dashed var(--line);padding:8px 0}
.ev:first-of-type{border-top:0}
.ev .head{font-weight:600}
.ev .url{font-size:12px;color:var(--accent);word-break:break-all}
.ev pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:6px;max-height:320px;overflow:auto;font:12.5px/1.55 ui-monospace,Consolas,monospace;margin:6px 0 0}
.ev img{max-width:100%;max-height:420px;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;background:var(--panel)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt label{border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;background:var(--panel)}
.opt input{margin-right:6px}
.opt label.on{outline:2px solid var(--accent)}
textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);font:inherit}
.help{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.req{padding:4px 0;border-bottom:1px dashed var(--line)}
.kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:760px){main{grid-template-columns:1fr}nav{position:static;max-height:220px}section{padding:12px 16px 80px}}
</style>
</head>
<body>
<header>
  <h1>核验器金标标注</h1>
  <span class="progress" id="progress"></span>

  <button onclick="go(-1)">上一条 <span class="kbd">P</span></button>
  <button onclick="go(1)">下一条 <span class="kbd">N</span></button>

</header>
<main>

    <div class="filter"><button onclick="setFilter('all')">全部</button><button onclick="setFilter('todo')">未标</button><button onclick="setFilter('finding')">F</button><button onclick="setFilter('answer')">A</button><button onclick="setFilter('plan')">P</button><button onclick="setFilter('plan_task')">T</button></div>
    <div id="list"></div>
  </nav>
  <section id="view"></section>
</main>

provenance": "来源材料：A（E1 → frame of video E1 at 113.680 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":113.671875,\"time_s\":113.68}", "image": "media/qvhighlights_5_r1g3_1_E12.jpg"}]}, {"id": "F011", "kind": "finding", "run": "vcsl_pair_1_v9_r1g3_1", "case_id": "vcsl:pair_1", "workspace": "W2-1", "finding_id": "F6", "task": "Resolve the two sampled candidate correspondences by directly comparing the surrounding footage in A (E1) and B (E2): A 9.967 s ↔ B 9.840 s and A 3.333 s ↔ B 25.880 s. Establish whether each represents identical or transformed footage and, where supported, determine the corresponding start and end times on both sides. Cite observed visual evidence for the correspondence, transformations and boundaries, and state any remaining boundary uncertainty or ambiguity from repeated footage. The existing whole-video comparison E21 yielded no consistent match; do not repeat that completed comparison or treat its negative result as excluding local matches. Do not infer original authorship or assess audio. Scope: correspondence A 9.967 s ↔ B 9.840 s; correspondence A 3.333 s ↔ B 25.880 s; the whole-video comparison found no correspondence.", "statement": "For A 3.333 s ↔ B 25.880 s, the recorded investigation reports a candidate start bracket of A 0.333–1.833 s ↔ B 22.880–24.380 s and an end bracket of A 3.333–6.333 s ↔ B 25.880–28.880 s. The visible A samples at 1.833 s and 3.333 s show crowned snowmen carrying gold ice-cream sceptres; the latter includes the shop behind their line.", "limitations": ["The brackets are recorded investigation results, with respective uncertainties of 1.500 s and 3.000 s.", "The B 25.880 s frame label establishes its time and source; its visual content was not examined in this decision. Consequently, the second pair's transformation cannot be independently described from the currently displayed pictures.", "Windowed alignment reportedly did not establish a match consistent with this anchor; repeated similar footage leaves the exact occurrence ambiguous."], "evidence": [{"id": "E55", "label": "frame of video E1 at 1.833 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 1.833 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.033,\"requested_time_s\":1.833,\"time_s\":1.833}", "image": "media/vcsl_pair_1_v9_r1g3_1_E55.jpg"}, {"id": "E5", "label": "frame of video E1 at 3.333 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 3.333 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.034,\"requested_time_s\":3.325,\"time_s\":3.333}", "image": "media/vcsl_pair_1_v9_r1g3_1_E5.jpg"}, {"id": "E22", "label": "frame of video E2 at 25.880 s", "source_url": null, "acquired_by": "INSPECT/locate_frames", "provenance": "来源材料：B（E2 → frame of video E2 at 25.880 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":25.8928125,\"time_s\":25.88}", "image": "media/vcsl_pair_1_v9_r1g3_1_E22.jpg"}]}, {"id": "F012", "kind": "finding", "run": "videosham_4008_v9_r1g3_1", "case_id": "videosham:4008", "workspace": "W1-1", "finding_id": "F2", "task": "Compare the given video A with the candidate video B, and investigate the differences between them that the materials can confirm and how those differences affect what the footage means. Cite specific evidence, and state where the differences are and what could not be determined. Being given as a candidate does not mean B's source identity has been confirmed; do not treat unexamined regions or modalities as having no difference.", "statement": "Specific textual evidence from Material A is the OCR of its derived image: “TRINITARIAN”, “HE”, and “FAITH”.", "limitations": ["These recognised strings do not establish a textual difference from Material B.", "OCR can miss characters; the strings alone do not establish the complete wording or its meaning."], "evidence": [{"id": "E33", "label": "OCR of E26: 3 text boxes, 3 distinct texts (\"TRINITARIAN\", \"HE\", \"FAITH\")", "source_url": null, "acquired_by": "INSPECT/ocr", "provenance": "来源材料：B（E2 → frame of video E2 at 0.000 s (cropped re… → OCR of E26: 3 text boxes, 3 distinct tex…）", "modalities": ["text"], "text": "{\"kind\":\"ocr\",\"operation\":\"ocr\",\"source_evidence_ids\":[\"E26\"],\"summary\":{\"text_boxes\":3,\"frames\":1,\"frames_with_text\":1,\"distinct_texts\":3,\"video\":false,\"texts\":[{\"text\":\"TRINITARIAN\",\"frames\":1,\"max_confidence\":0.912},{\"text\":\"HE\",\"frames\":1,\"max_confidence\":0.87},{\"text\":\"FAITH\",\"frames\":1,\"max_confidence\":0.991}]},\"backend\":\"RapidOCR\",\"limitations\":[\"coverage only describes temporal sampling of a video; null for a still image means not applicable, not that text recognition is complete or incomplete. OCR itself can still miss characters.\"],\"results\":[{\"image_evidence_id\":\"E26\",\"items\":[{\"text\":\"TRINITARIAN\",\"box\":[0.0151,0.0054,0.997,0.6087],\"confidence\":0.912},{\"text\":\"HE\",\"box\":[0.503,0.0,0.6958,0.1685],\"confidence\":0.87},{\"text\":\"FAITH\",\"box\":[0.244,0.3913,0.7139,0.788],\"confidence\":0.991}]}]}"}]}, {"id": "F013", "kind": "finding", "run": "videosham_4144_v9_r1g3_1", "case_id": "videosham:4144", "workspace": "W1-1", "finding_id": "F2", "task": "Compare the given video A with the candidate video B, and investigate the differences between them that the materials can confirm and how those differences affect what the footage means. Cite specific evidence, and state where the differences are and what could not be determined. Being given as a candidate does not mean B's source identity has been confirmed; do not treat unexamined regions or modalities as having no difference.", "statement": "The recorded frame labels establish sampling of both materials: Material A at 0.000 s and 3.770 s, and Material B at 2.236 s and a cropped region at 5.505 s.", "limitations": ["The frame labels establish source and sampling time only; they do not establish depicted objects, matching scenes or visual differences."], "evidence": [{"id": "E4", "label": "frame of video E1 at 0.000 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 0.000 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.03336666666666667,\"requested_time_s\":0.0,\"time_s\":0.0}", "image": "media/videosham_4144_v9_r1g3_1_E4.jpg"}, {"id": "E9", "label": "frame of video E1 at 3.770 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 3.770 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.03336666666666667,\"requested_time_s\":3.754,\"time_s\":3.7704333333333335}", "image": "media/videosham_4144_v9_r1g3_1_E9.jpg"}, {"id": "E28", "label": "frame of video E2 at 5.505 s (cropped region)", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：B（E2 → frame of video E2 at 5.505 s (cropped re…）", "modalities": ["image"], "text": "{\"box\":[0.145,0.195,0.325,0.515],\"box_px\":[185,140,416,371],\"frame_duration_s\":0.03336666666666667,\"requested_time_s\":5.5,\"time_s\":5.5055}", "image": "media/videosham_4144_v9_r1g3_1_E28.jpg"}]}, {"id": "F014", "kind": "finding", "run": "videosham_0104_v9_r1g3_1", "case_id": "videosham:0104", "workspace": "W1-1", "finding_id": "F1", "task": "Compare the given video A with the candidate video B, and investigate the differences between them that the materials can confirm and how those differences affect what the footage means. Cite specific evidence, and state where the differences are and what could not be determined. Being given as a candidate does not mean B's source identity has been confirmed; do not treat unexamined regions or modalities as having no difference.", "statement": "The comparison of Material A and Material B found no consistent correspondence. Comparisons therefore rest on sampled frames rather than an established temporal alignment.", "limitations": ["This result does not establish that the videos contain entirely different footage or identify an editing method.", "Material B's source identity is not established."], "evidence": [{"id": "E21", "label": "INSPECT compare_media result", "source_url": null, "acquired_by": "INSPECT/compare_media", "provenance": "来源材料：A、B（E1、E2 → INSPECT compare_media result）", "modalities": ["text"], "text": "{\"operation\":\"compare_media\",\"summary_lines\":[\"B is probably not the source of A: only 0% of A's half-second samples have a consistent match in B. Nothing else is reported.\",\"The pictures do not match, so the sound was compared on its own:\",\"Sound of A lines up with B at B = A +0.00 s (envelope correlation 1.00).\",\"28 of 28 one-second windows sound the same (100%).\"],\"images\":[],\"limitations\":[\"Only the same footage is matched (also mirrored, re-encoded, cropped or with overlays when the SIFT fallback ran); a re-shot or heavily re-edited version is not recognised.\",\"Sound is compared as spectral envelopes in one-second windows at a single global offset; a re-timed or re-ordered track is only partly matched.\"],\"note\":\"These lines are the conclusions of the measurement; the raw tables behind them (alignment runs, shot list, frame statistics) are not part of this record. Spans under 3 s that align at another speed or backwards are alignment noise around cuts.\"}"}]}, {"id": "F015", "kind": "finding", "run": "vcsl_pair_1_v9_r1g3_1", "case_id": "vcsl:pair_1", "workspace": "W2-1", "finding_id": "F7", "task": "Resolve the two sampled candidate correspondences by directly comparing the surrounding footage in A (E1) and B (E2): A 9.967 s ↔ B 9.840 s and A 3.333 s ↔ B 25.880 s. Establish whether each represents identical or transformed footage and, where supported, determine the corresponding start and end times on both sides. Cite observed visual evidence for the correspondence, transformations and boundaries, and state any remaining boundary uncertainty or ambiguity from repeated footage. The existing whole-video comparison E21 yielded no consistent match; do not repeat that completed comparison or treat its negative result as excluding local matches. Do not infer original authorship or assess audio. Scope: correspondence A 9.967 s ↔ B 9.840 s; correspondence A 3.333 s ↔ B 25.880 s; the whole-video comparison found no correspondence.", "statement": "The displayed evidence supports local visual correspondence at the first anchor and at the later heart gesture, rather than a demonstrated whole-video alignment.", "limitations": ["The supplied task records that the existing whole-video comparison found no consistent match; that negative result does not exclude these local correspondences.", "The whole-video comparison was not repeated.", "Repeated-scene retrieval candidates cannot establish unique source times or continuous ranges. Audio and original authorship are outside this task."], "evidence": [{"id": "E7", "label": "frame of video E1 at 9.967 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 9.967 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.033,\"requested_time_s\":9.975,\"time_s\":9.967}", "image": "media/vcsl_pair_1_v9_r1g3_1_E7.jpg"}, {"id": "E26", "label": "frame of video E2 at 9.840 s", "source_url": null, "acquired_by": "INSPECT/locate_frames", "provenance": "来源材料：B（E2 → frame of video E2 at 9.840 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":9.8465625,\"time_s\":9.84}", "image": "media/vcsl_pair_1_v9_r1g3_1_E26.jpg"}, {"id": "E57", "label": "frame of video E1 at 15.967 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：A（E1 → frame of video E1 at 15.967 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.033,\"requested_time_s\":15.967,\"time_s\":15.967}", "image": "media/vcsl_pair_1_v9_r1g3_1_E57.jpg"}, {"id": "E66", "label": "frame of video E2 at 15.840 s", "source_url": null, "acquired_by": "INSPECT/get_frames", "provenance": "来源材料：B（E2 → frame of video E2 at 15.840 s）", "modalities": ["image"], "text": "{\"frame_duration_s\":0.04,\"requested_time_s\":15.84,\"time_s\":15.84}", "image": "media/vcsl_pair_1_v9_r1g3_1_E66.jpg"}]}, {"id": "A001", "kind": "answer", "run": "fmnv_fv_f82ltBGY52g_r1g3_1", "case_id": "fmnv:fv_f82ltBGY52g", "request": "request_0014", "task": "The given video circulated online. Find its original source video and determine whether and how this version differs from the original: which parts were removed, added, reordered or altered, with times in both videos. Cite specific evidence, and state what could not be determined.", "answer": "A source was found: the FRANCE 24 English upload at https://www.youtube.com/watch?v=f82ltBGY52g. [E38] All of the given video’s half-second picture samples match this source. [E25]\nThe given video (A) lasts 55.920 seconds. [E2] The original lasts 110.480 seconds. [E24]\n\nReported removals:\n- At A 24.7 s: original 26.2–45.1 s omitted. [E25]\n- At A 43.8 s: original 63.9–69.5 s omitted. [E25]\n- At A 46.7 s: original 72.0–75.5 s omitted. [E25]\n- At A 49.3 s: original 77.4–99.0 s omitted. [E25]\n\nSound differs across these corresponding spans (A ↔ original): 0.0–24.5 ↔ 1.6–26.2 s; 25.0–43.5 ↔ 45.1–63.9 s; 44.0–46.5 ↔ 69.5–72.0 s; 47.0–49.0 ↔ 75.5–77.4 s; 49.5–53.0 ↔ 99.0–102.6 s; 53.5–55.5 ↔ 108.0–110.0 s. [E25]\n\nBoundaries are approximate to 0.5 seconds; removed-scene content, exhaustive omissions, additions, reordering, speed changes, local visual alterations and the specific speech/background-sound changes remain unverified. [E25]", "requirements": [{"id": "REQ1", "text": "给定视频的原始来源视频（地址、频道或标题），以及据以认定的画面对应证据", "must_cite": true}, {"id": "REQ2", "text": "给定视频与原片的差异：至少指出一处删掉 / 添加 / 调换 / 改变的部分，并引用比对记录", "must_cite": true}, {"id": "REQ3", "text": "未能确定的内容（未比对的模态、边界精度等）", "must_cite": false}], "findings": [], "evidence": [{"id": "E2", "label": "media profile: video, 55.920 s, 1280×720, 25.000 fps, 1 audio track; this record does not verify date, place, author or other source metadata and cannot show that such information is absent.", "source_url": null, "acquired_by": "INSPECT/media_profile", "provenance": "来源材料：A（E1 → media profile: video, 55.920 s, 1280×720…）", "modalities": ["text"], "text": "{\"audio_tracks\":1,\"backend\":\"PyAV\",\"duration_s\":55.92,\"format\":\"mov,mp4,m4a,3gp,3g2,mj2\",\"fps\":25.0,\"frame_count\":1398,\"height\":720,\"media_kind\":\"video\",\"version\":\"17.0.0\",\"width\":1280}"}, {"id": "E24", "label": "media profile: video, 110.480 s, 1280×720, 25.000 fps, 1 audio track; this record does not verify date, place, author or other source metadata and cannot show that such information is absent.", "source_url": null, "acquired_by": "INSPECT/media_profile", "provenance": "来源：外部网页 youtube.com（E23 → media profile: video, 110.480 s, 1280×72…）", "modalities": ["text"], "text": "{\"audio_tracks\":1,\"backend\":\"PyAV\",\"duration_s\":110.48,\"format\":\"matroska,webm\",\"fps\":25.0,\"height\":720,\"media_kind\":\"video\",\"version\":\"17.0.0\",\"width\":1280}"}, {"id": "E25", "label": "INSPECT compare_media result", "source_url": null, "acquired_by": "INSPECT/compare_media", "provenance": "来源：材料 A、外部网页 youtube.com（E1、E23 → INSPECT compare_media result）", "modalities": ["text"], "text": "{\"operation\":\"compare_media\",\"summary_lines\":[\"B matches A: 100% of A's half-second samples are found in B (A 56 s, B 110 s; the matched footage lies in B 2-110 s).\",\"Sound: A 0.0-24.5 s: the sound differs from B's sound at the same moment (B 1.6-26.2 s; spectral similarity 0.06).\",\"Sound: A 25.0-43.5 s: the sound differs from B's sound at the same moment (B 45.1-63.9 s; spectral similarity 0.04).\",\"Sound: A 44.0-46.5 s: the sound differs from B's sound at the same moment (B 69.5-72.0 s; spectral similarity 0.09).\",\"Sound: A 47.0-49.0 s: the sound d     const radio = (field, opts) => `<div class="opt" style="margin-top:4px">${opts.map(([v,tx]) => `<label class="${l[field]===v?'on':''}"><input type="radio" name="${field}" ${l[field]===v?'checked':''} onchange="setField('${field}','${v}')">${tx}</label>`).join('')}</div>`;
    body += `<div class="box"><h3>总任务（第 ${esc(it.round)} 轮）</h3>${esc(it.task)}</div>
      <div class="box"><h3>案卷要求</h3>${it.requirements.map(r => `<div class="req">${esc(r.id)}${r.must_cite?'':'（可选）'}：${esc(r.text)}</div>`).join('') || '<div class="help">（没有案卷）</div>'}</div>
      <div class="box"><h3>此前已提交的报告（派任务时能看到的全部）</h3>${it.reports_so_far.map(r => `<div class="ev"><div class="head">${esc(r.task_id)} · ${esc(r.status)}</div><div class="help">${esc(r.task)}</div>
        ${r.findings.map(f => `<div>· ${esc(f.id)}：${esc(f.statement)}${f.limitations.length ? `<span class="help">（限制：${f.limitations.map(esc).join('；')}）</span>` : ''}</div>`).join('')}</div>`).join('') || '<div class="help">（这是第一轮，还没有报告）</div>'}</div>
      <div class="box"><h3>待判任务 ${esc(it.task_label)}</h3><div class="statement">${esc(it.target.task)}</div><div class="help">材料：${(it.target.materials||[]).join('、') || '（无）'}</div>
        ${it.siblings.length ? `<div class="help" style="margin-top:6px">同轮其他任务：${it.siblings.map(t => esc(t.label) + ' ' + esc(t.task)).join('；')}</div>` : ''}</div>
      <div class="box"><h3>A. 题面有没有把还没证实的说法当成事实写进去？</h3><div class="help">"证实"只看上面已提交的报告；题面说"核实某说法是否属实"不算夹带。</div>
        ${radio('premise', [['clean','没有'],['smuggled','有'],['unsure','不确定']])}
        <div class="help" style="margin-top:6px">若"有"：照抄夹带的片段（多段用 ｜ 分隔）</div><textarea oninput="setText('premise_span',this.value)">${esc(l.premise_span||'')}</textarea></div>
      <div class="box"><h3>B. 这个任务是否针对此前报告还没解决的缺口？</h3>${radio('gap', [['gap','针对未解决的缺口'],['no_gap','不针对（要查的已解决，或与缺口无关）'],['unsure','不确定']])}</div>`;
  } else {
    body += `<div class="box"><h3>总任务（第 ${esc(it.round)} 轮）</h3>${esc(it.task)}</div>
      <div class="box"><h3>此前已提交的报告</h3>${it.reports_so_far.map(r => `<div class="ev"><div class="head">${esc(r.task_id)} · ${esc(r.status)}</div><div class="help">${esc(r.task)}</div>
        ${r.findings.map(f => `<div>· ${esc(f.id)}：${esc(f.statement)}${f.limitations.length ? `<span class="help">（限制：${f.limitations.map(esc).join('；')}）</span>` : ''}</div>`).join('')}</div>`).join('') || '<div class="help">（这是第一轮，还没有报告）</div>'}</div>
      <div class="box"><h3>本轮派出的任务</h3>${it.proposed_tasks.map((t,k) => `<div class="req"><b>T${k+1}</b> ${esc(t.task)} <span class="help">${(t.materials||[]).join('、')}</span>
        <div class="opt" style="margin-top:4px">${[['yes','针对未解决的缺口'],['no','不针对'],['unsure','不确定']].map(([v,tx]) => `<label class="${(l.tasks||{})['T'+(k+1)]===v?'on':''}"><input type="radio" name="t_${k}" ${(l.tasks||{})['T'+(k+1)]===v?'checked':''} onchange="setTask('T${k+1}','${v}')">${tx}</label>`).join('')}</div></div>`).join('')}</div>`;
  }
  body += `<div class="box"><h3>${m.q} <span class="help">键盘 1–4</span></h3><div class="opt">${m.opts.map(([v,t],k) => `<label class="${l.main===v?'on':''}"><input type="radio" name="main" ${l.main===v?'checked':''} onchange="setMain('${v}')">${k+1}. ${t}</label>`).join('')}</div></div>
    <div class="box"><h3>具体问题（可多选）</h3><div class="chips">${ERR[it.kind].map(([v,t]) => `<span class="chip ${l.errors.includes(v)?'on':''}" onclick="toggleErr('${v}')">${t}</span>`).join('')}</div>
      ${it.kind==='finding' ? `<div style="margin-top:8px"><div class="help">超出证据的具体片段（原文照抄，可多段用 ｜ 分隔）</div><textarea oninput="setText('span',this.value)">${esc(l.span||'')}</textarea></div>` : ''}
      <div style="margin-top:8px"><div class="help">备注</div><textarea oninput="setText('note',this.value)">${esc(l.note||'')}</textarea></div></div>
    <div class="row"><span class="help">本条累计用时 ${Math.round((l.seconds||0)/60*10)/10} 分钟（切换条目时累计）</span><button class="primary" onclick="go(1)">保存并下一条</button></div>`;
  document.getElementById('view').innerHTML = body;
}
function setMain(v){ lab(ITEMS[cur].id).main = v; save(); render(); }
function setReq(r,v){ const l = lab(ITEMS[cur].id); (l.req = l.req || {})[r] = v; save(); render(); }
function setField(k,v){ lab(ITEMS[cur].id)[k] = v; save(); render(); }
function setTask(t,v){ const l = lab(ITEMS[cur].id); (l.tasks = l.tasks || {})[t] = v; save(); render(); }
function toggleErr(v){ const l = lab(ITEMS[cur].id); l.errors = l.errors.includes(v) ? l.errors.filter(x=>x!==v) : [...l.errors, v]; save(); render(); }
function setText(k,v){ lab(ITEMS[cur].id)[k] = v; save(); }
function exportLabels(){
  tick();
  const who = document.getElementById('annotator').value.trim() || 'anon';
  const out = {batch: BATCH, annotator: who, exported_at: new Date().toISOString(),
    labels: ITEMS.filter(it => labels[it.id]).map(it => ({id: it.id, kind: it.kind, run: it.run, ...labels[it.id]}))};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `labels_${who}.json`; a.click();
}
function importLabels(file){
  if (!file) return;
  file.text().then(t => { const d = JSON.parse(t); if (d.batch !== BATCH && !confirm('批次名不一致，仍然导入？')) return;
    for (const r of d.labels) { const {id, kind, run, ...rest} = r; labels[id] = rest; } save(); render(); });
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  const it = ITEMS[cur]; const opts = MAIN[it.kind].opts;
  if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') go(1);
  else if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowLeft') go(-1);
  else if (/^[1-4]$/.test(e.key)) setMain(opts[+e.key-1][0]);
});
window.addEventListener('beforeunload', () => { tick(); try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {} });
render(); renderList();
</script>
</body>
</html>
