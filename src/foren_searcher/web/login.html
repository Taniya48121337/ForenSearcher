<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForenSearcher · 邀请试用</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/login.js" defer></script></head>
<body class="login-page"><main class="login-card">
<a class="brand" href="/"><span class="brand-mark">F<span>·</span></span><span>ForenSearcher<small>调查工作台</small></span></a>
<h1>邀请试用</h1><p>输入收到的邀请码，进入你的调查工作空间。</p>
<form id="login-form"><label for="invite-code">邀请码</label><input id="invite-code" name="code" type="password" autocomplete="current-password" required maxlength="64" autofocus>

</main></body></html>
